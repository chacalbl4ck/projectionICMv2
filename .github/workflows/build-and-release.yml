name: CI/CD - Projeção ICM

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publicar Release no GitHub com o executável anexado?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    name: 🧪 Testes de Integridade (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Executar Suíte de Testes
        run: node test/test_suite.js

  build-windows:
    name: 🪟 Compilação do Executável Windows (ProjecaoICM.exe)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar Integridade Local
        run: node test/test_suite.js

      - name: Compilar ProjecaoICM.exe (.NET Framework csc.exe)
        run: node desktop/Compilar_Exe.js

      - name: Executar Autoteste do Executável (--self-test)
        shell: powershell
        run: |
          Start-Process -FilePath ".\ProjecaoICM.exe" -ArgumentList "--self-test" -NoNewWindow -Wait -RedirectStandardOutput "self_test.log" -RedirectStandardError "self_test_err.log"
          Get-Content self_test.log
          if (Test-Path self_test_err.log) {
            $errs = Get-Content self_test_err.log
            if ($errs) { Write-Error "Erros no self-test: $errs" }
          }

      - name: Gerar Checksum SHA-256
        shell: powershell
        run: |
          $hash = (Get-FileHash ProjecaoICM.exe -Algorithm SHA256).Hash
          "$hash  ProjecaoICM.exe" | Out-File -Encoding utf8 SHA256SUMS.txt
          Write-Host "Checksum SHA-256: $hash"

      - name: Upload dos Artefatos de Build
        uses: actions/upload-artifact@v4
        with:
          name: ProjecaoICM-Windows
          path: |
            ProjecaoICM.exe
            SHA256SUMS.txt
          retention-days: 30

  release:
    name: 🚀 Publicar Release no GitHub
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    runs-on: windows-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Baixar Artefatos Compilados
        uses: actions/download-artifact@v4
        with:
          name: ProjecaoICM-Windows

      - name: Criar GitHub Release e Anexar Executável
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ProjecaoICM.exe
            SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
