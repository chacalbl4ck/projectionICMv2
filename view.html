<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>View - Projection HTML5</title>
  <link rel="stylesheet" href="css/reveal.css">
  <link rel="stylesheet" href="css/theme/icm.css" id="theme"> 
  <link rel="stylesheet" href="css/view.css"> 
</head>
<body>
  <!-- Camada de Blackout Instantâneo -->
  <div id="blackoutOverlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000000; z-index: 999999; opacity: 0; pointer-events: none; transition: opacity 0.25s ease-in-out;"></div>

  <!-- Palco dedicado de mídia fullscreen respeitando dimensões do telão e aspect ratio -->
  <div id="telaoMediaStage" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000000; z-index: 500; display: none; align-items: center; justify-content: center; overflow: hidden;">
    <img id="telaoStageImg" alt="" style="display: none; width: 100%; height: 100%; max-width: 100vw; max-height: 100vh; object-fit: contain; margin: 0; border: none; box-shadow: none; background: transparent;">
    <video id="telaoStageVideo" playsinline loop preload="auto" style="display: none; width: 100%; height: 100%; max-width: 100vw; max-height: 100vh; object-fit: contain; margin: 0; border: none; box-shadow: none; background: #000000;"></video>
  </div>

  <!-- Canvas de captura visual do último frame ao congelar vídeos -->
  <canvas id="telaoFreezeCanvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 800; pointer-events: none; display: none; background-color: #000000;"></canvas>

  <!-- 2. Create hidden header/footer <div> -->
  <div class="reveal">
    <!-- Headers Padrão ICM -->
    <header class="winetitle"><div id="titulo"></div><div id="logo" style="background-color:white"><i class="icon-logo_bold"></i></div></header>
    <header class="winetitle2"><div id="titulo"><br></div><div id="logo" style="background-color:white"><i class="icon-logo_bold"></i></div></header>    
    <header class="whitelogo"><div id="logo" style="float:right"><i class="icon-logo_bold_white"></i></div></header>
    <header class="backlay1-pt-br"><div class="backlay_1-pt-br"><i class="logo_tela_padrao icon-logo_bold_white"></i></div></header>

    <footer class="fim">FIM</footer>
    <footer class="scripturetitle"><small></small></footer>      

    <div class="slides"></div>    
  </div>

  <!-- Scripts -->
  <script src="js/jquery-3.3.1.min.js"></script>
  <script src="js/reveal.js"></script>
  <script>
    Reveal.initialize({
      controls: false,
      progress: false,
      history: false,
      keyboard: true,
      center: true,
      theme: Reveal.getQueryHash().theme,
      transition: 'fade',
    });  
    (function(){
    // ==========================================
    // CANAL DE COMUNICAÇÃO NATIVO BROADCASTCHANNEL
    // ==========================================
    const projectionChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('projecao_icm_channel') : null;

    // Distingue se esta janela é o TELÃO EXTERNO real ou apenas o IFRAME de miniatura no painel
    const isExternalTelao = (window.self === window.top);

    // ==========================================
    // AJUSTE DINÂMICO DE TEXTO PARA IMPEDIR TRUNCAMENTO
    // ==========================================
    function fitTextToSlide() {
      var slide = Reveal.getCurrentSlide();
      if (!slide) return;
      var verseText = slide.querySelector('.verse-text') || slide.querySelector('.verse-container') || slide.querySelector('div[style*="font-size"]');
      if (!verseText) return;

      verseText.style.transform = '';
      verseText.style.transformOrigin = 'center center';
      verseText.style.display = 'inline-block';

      // Dimensões úteis máximas no canvas do Reveal (1920x1080)
      // Cabeçalho institucional ocupa ~120px e rodapé "FIM" ocupa ~80px
      var maxW = 1820; 
      var maxH = 880;

      var textW = verseText.scrollWidth || verseText.offsetWidth;
      var textH = verseText.scrollHeight || verseText.offsetHeight;

      // Se o conteúdo ultrapassar a área útil, calcula a proporção exata para caber perfeitamente
      if (textW > maxW || textH > maxH) {
        var scaleW = maxW / textW;
        var scaleH = maxH / textH;
        var scale = Math.min(scaleW, scaleH);
        if (scale < 1.0 && scale >= 0.55) {
          verseText.style.transform = 'scale(' + scale.toFixed(3) + ')';
        }
      }
    }

    var lastProcessedSig = '';
    var lastProcessedTime = 0;

    function enviarMensagemParaPainel(msgObj) {
      if (isExternalTelao && projectionChannel) {
        try { projectionChannel.postMessage(msgObj); } catch(e) {}
      }
      var target = (window.opener && !window.opener.closed) ? window.opener : (window.parent && window.parent !== window ? window.parent : null);
      if (target) {
        try { target.postMessage(msgObj, "*"); } catch(e) {}
      }
    }

    function processCommand(funcName, payload) {
      // Nunca descartar entrega de mídia por deduplicação de assinatura
      if (funcName === 'RESPONSE_MEDIA_BLOB' && payload) {
        var mid = payload.mediaId;
        var fName = payload.fileName;
        var localUrl = null;

        if (payload.arrayBuffer) {
          var bufBlob = new Blob([payload.arrayBuffer], { type: payload.mimeType || 'application/octet-stream' });
          localUrl = window.URL.createObjectURL(bufBlob);
        } else if (payload.blob) {
          localUrl = window.URL.createObjectURL(payload.blob);
        } else if (payload.dataUrl) {
          localUrl = payload.dataUrl;
        }

        if (localUrl) {
          if (mid) telaoLocalBlobUrls[mid] = localUrl;
          if (fName) telaoLocalBlobUrls['file:' + fName] = localUrl;

          var sImg = document.getElementById('telaoStageImg');
          var sVid = document.getElementById('telaoStageVideo');
          [sImg, sVid].forEach(function(st) {
            if (!st || st.style.display === 'none') return;
            var sMid = st.getAttribute('data-media-id');
            var sName = st.getAttribute('data-file-name');
            if ((mid && sMid === mid) || (!mid && fName && sName === fName)) {
              aplicarBlobUrl(st, localUrl, mid, fName);
            }
          });

          var selector = mid ? ('img[data-media-id="' + mid + '"], video[data-media-id="' + mid + '"]') : ('img[data-file-name="' + fName + '"], video[data-file-name="' + fName + '"]');
          document.querySelectorAll(selector).forEach(function(el) {
            if (el.id !== 'telaoStageImg' && el.id !== 'telaoStageVideo') {
              aplicarBlobUrl(el, localUrl, mid, fName);
            }
          });
        }
        return;
      }

      if (funcName === 'VIDEO_CONTROL' && payload) {
        var cmdKey = payload.cmdId ? ('cmd:' + payload.cmdId) : '';
        if (cmdKey && cmdKey === lastVideoControlKey) return;
        if (cmdKey) lastVideoControlKey = cmdKey;
        executarControleVideo(payload);
        return;
      }

      if (funcName === 'VIDEO_SYNC' && payload) {
        if (!isExternalTelao) {
          var syncKey = payload.syncId
            ? ('id:' + payload.syncId)
            : ((payload.sentAt || 0) + '|' + (payload.currentTime || 0) + '|' + !!payload.paused);
          if (syncKey === lastVideoSyncKey) return;
          lastVideoSyncKey = syncKey;
          aplicarSyncVideoPreview(payload);
        }
        return;
      }

      var sig = funcName + '_' + (typeof payload === 'object' ? JSON.stringify(payload) : String(payload));
      var now = Date.now();
      if (sig === lastProcessedSig && (now - lastProcessedTime) < 120) {
        return; // Ignora duplicatas simultâneas de BroadcastChannel + postMessage
      }
      lastProcessedSig = sig;
      lastProcessedTime = now;

      if (funcName === 'reloadReveal' || funcName === 'RELOAD_SLIDES') {
        reloadReveal(payload);
      } else if (funcName === 'changeSlide' || funcName === 'CHANGE_SLIDE') {
        changeSlide(payload);
      } else if (funcName === 'changeBg' || funcName === 'CHANGE_BG') {
        changeBg(payload);
      } else if (funcName === 'changeTheme' || funcName === 'CHANGE_THEME') {
        changeTheme(payload);
      } else if (funcName === 'changeFontSize' || funcName === 'CHANGE_FONT_SIZE') {
        changeFontSize(payload);
      } else if (funcName === 'blackout' || funcName === 'BLACKOUT') {
        toggleBlackout(payload);
      } else if (funcName === 'freeze' || funcName === 'FREEZE') {
        toggleFreezeScreen(payload);
      } else if (funcName === 'PING') {
        if (isExternalTelao) {
          enviarMensagemParaPainel({ action: 'PONG', isExternal: true, timestamp: Date.now() });
        }
      } else if (funcName === 'REQUEST_STATUS') {
        if (isExternalTelao) {
          enviarMensagemParaPainel({ action: 'TELAO_READY', isExternal: true, timestamp: Date.now() });
        }
      }
    }

    if (projectionChannel) {
      projectionChannel.onmessage = function(event) {
        if (!event.data) return;
        processCommand(event.data.action, event.data.payload);
      };
    }

    // Compatibilidade via postMessage (iframe de miniatura, protocolo file:/// e navegadores legados)
    window.addEventListener('message', function(event) {
      try {
        var data = (typeof event.data === 'string') ? JSON.parse(event.data) : event.data;
        if (data && data.host === 'projection-html5') {
          processCommand(data.function, data.data);
        } else if (data && data.action) {
          processCommand(data.action, data.payload);
        }
      } catch (e) {}
    });

    function toggleBlackout(status) {
      var overlay = document.getElementById('blackoutOverlay');
      if (overlay) {
        overlay.style.opacity = status ? "1" : "0";
      }
    }

    function changeSlide(number) {
      var slideNum = (typeof number === 'number') ? number : parseInt(number, 10);
      if (isNaN(slideNum) || slideNum < 0) slideNum = 0;
      if (isExternalTelao && isTelaoFrozen) {
        pendingFrozenSlide = slideNum;
        return;
      }
      if (!isExternalTelao && isPreviewFrozen) {
        isPreviewFrozen = false;
        ocultarCanvasCongelado();
      }
      var curSlideBefore = (typeof Reveal.getIndices === 'function') ? (Reveal.getIndices().h || 0) : 0;
      if (unfreezeResumeTimer && slideNum !== curSlideBefore) {
        clearTimeout(unfreezeResumeTimer);
        unfreezeResumeTimer = null;
      }
      Reveal.slide(slideNum, slideNum, slideNum);
      setTimeout(function() {
        fitTextToSlide();
        atualizarStageMidia();
      }, 50);
    }

    function clearSlide(status) {
      if (status)
        $('.slides').fadeOut('slow');
      else
        $('.slides').fadeIn('slow');
    }       

    function changeBg(fileURL) {
      document.body.style.backgroundImage = "url(" + fileURL + ")";
    }

    function changeTheme(name){
      document.getElementById('theme').setAttribute('href', 'css/theme/'+name+'.css');
    }

    function changeFontSize(size){
      size = parseFloat(size);
      if (isNaN(size)) size = 2;
      size += 2;
      $('.reveal').css("font-size", size + "vw");
      setTimeout(fitTextToSlide, 50);
    }

    var lastLoadedSlidesHtml = null;

    function reloadReveal(payload){
      if (isExternalTelao && isTelaoFrozen) {
        pendingFrozenReload = payload;
        return;
      }
      var htmlContent = (typeof payload === 'object' && payload !== null && typeof payload.html === 'string')
        ? payload.html
        : (typeof payload === 'string' ? payload : '');
      var targetSlide = null;
      if (typeof payload === 'object' && payload !== null && typeof payload.currentSlide === 'number') {
        targetSlide = payload.currentSlide;
      } else {
        var indices = (typeof Reveal.getIndices === 'function') ? Reveal.getIndices() : { h: 0 };
        targetSlide = (indices && typeof indices.h === 'number') ? indices.h : 0;
      }

      // Evita recriar o DOM do Reveal quando os slides não mudaram (impede loop de reloading e piscadas)
      if (lastLoadedSlidesHtml !== null && htmlContent === lastLoadedSlidesHtml) {
        var curIndices = (typeof Reveal.getIndices === 'function') ? Reveal.getIndices() : { h: 0 };
        if (!curIndices || curIndices.h !== targetSlide) {
          changeSlide(targetSlide);
        } else {
          atualizarStageMidia();
        }
        return;
      }

      lastLoadedSlidesHtml = htmlContent;
      activeStageMediaKey = "";
      $('.slides').html(htmlContent);
      if (typeof Reveal.sync === 'function') Reveal.sync();
      if (typeof Reveal.layout === 'function') Reveal.layout();
      changeSlide(targetSlide);
      setTimeout(verificarEResolverMidias, 100);
    }

    var telaoLocalBlobUrls = {};
    var retriedWithBuffer = {};

    function obterBlobDoIndexedDB(mediaId) {
      return new Promise(function(resolve) {
        if (!window.indexedDB || !mediaId) return resolve(null);
        try {
          var req = indexedDB.open("ProjecaoICM_DB", 1);
          req.onsuccess = function(e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains("media")) return resolve(null);
            var tx = db.transaction("media", "readonly");
            var store = tx.objectStore("media");
            var getReq = store.get(mediaId);
            getReq.onsuccess = function() {
              var res = getReq.result;
              if (res && res.data) {
                var fileOrBlob = res.data;
                if (fileOrBlob instanceof Blob || fileOrBlob instanceof File) {
                  resolve(fileOrBlob);
                } else if (typeof fileOrBlob.getFile === 'function') {
                  fileOrBlob.getFile().then(resolve).catch(function() { resolve(null); });
                } else if (typeof fileOrBlob === 'string' && fileOrBlob.startsWith('data:')) {
                  resolve(fileOrBlob);
                } else {
                  resolve(null);
                }
              } else {
                resolve(null);
              }
            };
            getReq.onerror = function() { resolve(null); };
          };
          req.onerror = function() { resolve(null); };
        } catch(err) { resolve(null); }
      });
    }

    var isTelaoFrozen = false;
    var isPreviewFrozen = false;
    var pendingFrozenReload = null;
    var pendingFrozenSlide = null;
    var frozenSlideIndex = null;
    var unfreezeResumeTimer = null;

    function estaCongeladoAgora() {
      return isExternalTelao ? isTelaoFrozen : isPreviewFrozen;
    }

    function capturarQuadroVideoParaCanvas(vid) {
      var canvas = document.getElementById('telaoFreezeCanvas');
      if (!canvas || !vid || !vid.videoWidth || !vid.videoHeight) return false;
      try {
        var cw = window.innerWidth || canvas.clientWidth || vid.videoWidth;
        var ch = window.innerHeight || canvas.clientHeight || vid.videoHeight;
        if (!cw || !ch) return false;
        canvas.width = cw;
        canvas.height = ch;
        var ctx = canvas.getContext('2d');
        if (!ctx) return false;
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, cw, ch);
        var scale = Math.min(cw / vid.videoWidth, ch / vid.videoHeight);
        var dw = vid.videoWidth * scale;
        var dh = vid.videoHeight * scale;
        ctx.drawImage(vid, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
        canvas.style.display = 'block';
        return true;
      } catch(e) {
        return false;
      }
    }

    function ocultarCanvasCongelado() {
      var canvas = document.getElementById('telaoFreezeCanvas');
      if (canvas) {
        canvas.style.display = 'none';
        try {
          var ctx = canvas.getContext('2d');
          if (ctx) ctx.clearRect(0, 0, canvas.width || 0, canvas.height || 0);
        } catch(e) {}
      }
    }

    function toggleFreezeScreen(status) {
      var frozen = !!status;

      if (!isExternalTelao) {
        if (frozen === isPreviewFrozen) return;
        isPreviewFrozen = frozen;
        if (isPreviewFrozen) {
          var pAtivo = obterVideoAtivoParaSync();
          if (pAtivo && pAtivo.el) capturarQuadroVideoParaCanvas(pAtivo.el);
          document.querySelectorAll('video').forEach(function(v) {
            v.dataset.wasPlayingBeforeFreeze = (!v.paused && v.dataset.userPaused !== 'true') ? '1' : '0';
            v.removeAttribute('autoplay');
            v.autoplay = false;
            try { v.pause(); } catch(e) {}
          });
          emitirEstadoPreviewParaPainel();
        } else {
          ocultarCanvasCongelado();
          document.querySelectorAll('video').forEach(function(v) {
            var wp = (v.dataset.wasPlayingBeforeFreeze === '1');
            delete v.dataset.wasPlayingBeforeFreeze;
            if (wp && v.style.display !== 'none' && v.dataset.userPaused !== 'true') {
              reproduzirVideoComFallback(v);
            }
          });
          emitirEstadoPreviewParaPainel();
        }
        return;
      }

      if (frozen === isTelaoFrozen) return;
      isTelaoFrozen = frozen;

      if (unfreezeResumeTimer) {
        clearTimeout(unfreezeResumeTimer);
        unfreezeResumeTimer = null;
      }

      if (isTelaoFrozen) {
        frozenSlideIndex = (typeof Reveal.getIndices === 'function') ? (Reveal.getIndices().h || 0) : 0;
        var ativoFreeze = obterVideoAtivoParaSync();
        if (ativoFreeze && ativoFreeze.el) {
          capturarQuadroVideoParaCanvas(ativoFreeze.el);
        }
        document.querySelectorAll('video').forEach(function(v) {
          v.dataset.wasPlayingBeforeFreeze = (!v.paused && v.dataset.userPaused !== 'true') ? '1' : '0';
          v.dataset.mutedBeforeFreeze = v.muted ? '1' : '0';
          v.removeAttribute('autoplay');
          v.autoplay = false;
          try { v.pause(); } catch(e) {}
          v.dataset.forcingMute = '1';
          v.muted = true;
          try { v.volume = 0; } catch(e) {}
          delete v.dataset.forcingMute;
        });
        emitirSyncVideoTelao();
      } else {
        ocultarCanvasCongelado();
        var prevFrozenSlide = frozenSlideIndex;
        frozenSlideIndex = null;

        if (pendingFrozenReload !== null) {
          var rPayload = pendingFrozenReload;
          pendingFrozenReload = null;
          if (pendingFrozenSlide !== null) {
            if (typeof rPayload === 'object' && rPayload !== null) {
              rPayload = Object.assign({}, rPayload, { currentSlide: pendingFrozenSlide });
            }
            pendingFrozenSlide = null;
          }
          reloadReveal(rPayload);
        } else if (pendingFrozenSlide !== null) {
          var pSlide = pendingFrozenSlide;
          pendingFrozenSlide = null;
          changeSlide(pSlide);
        }

        unfreezeResumeTimer = setTimeout(function() {
          unfreezeResumeTimer = null;
          if (isTelaoFrozen) return;
          var curIdx = (typeof Reveal.getIndices === 'function') ? (Reveal.getIndices().h || 0) : 0;
          var mudouSlide = (prevFrozenSlide !== null && curIdx !== prevFrozenSlide);
          document.querySelectorAll('video').forEach(function(v) {
            var wasMuted = (v.dataset.mutedBeforeFreeze === '1');
            var wasPlaying = (v.dataset.wasPlayingBeforeFreeze === '1');
            delete v.dataset.mutedBeforeFreeze;
            delete v.dataset.wasPlayingBeforeFreeze;

            if (!mudouSlide && v.style.display !== 'none') {
              v.muted = wasMuted;
              try { v.volume = 1; } catch(e) {}
              if (wasPlaying && v.dataset.userPaused !== 'true') {
                reproduzirVideoComFallback(v);
              }
            } else if (mudouSlide) {
              v.muted = false;
              try { v.volume = 1; } catch(e) {}
            }
          });
          emitirSyncVideoTelao();
        }, 50);
      }
    }

    function reproduzirVideoComFallback(videoEl, tentarComAudio) {
      if (!videoEl || videoEl.tagName !== 'VIDEO') return;
      if (estaCongeladoAgora() || videoEl.dataset.userPaused === 'true') {
        try { videoEl.pause(); } catch(e) {}
        return;
      }
      if (!isExternalTelao) {
        videoEl.muted = true;
        videoEl.defaultMuted = true;
        try { videoEl.volume = 0; } catch(e) {}
      } else if (tentarComAudio && videoEl.dataset.autoMutedFallback === 'true') {
        videoEl.muted = false;
      }
      try {
        var p = videoEl.play();
        if (p !== undefined) {
          p.catch(function(err) {
            // Se bloqueado pela política de autoplay de popup sem interação prévia, inicia no mudo para garantir exibição visual imediata
            if (err && (err.name === 'NotAllowedError' || String(err).indexOf('NotAllowedError') !== -1)) {
              videoEl.muted = true;
              videoEl.dataset.autoMutedFallback = 'true';
              if (!isTelaoFrozen && videoEl.dataset.userPaused !== 'true') {
                videoEl.play().catch(function(){});
              }
            }
          });
        }
      } catch(e){}
    }

    // Desbloqueia áudio se usuário clicar diretamente no Telão externo (respeitando Congelar e Pausa)
    document.addEventListener('click', function() {
      if (!isExternalTelao || isTelaoFrozen) return;
      document.querySelectorAll('video').forEach(function(v) {
        if (v.muted && v.style.display !== 'none' && !v.paused && v.dataset.userPaused !== 'true') {
          v.muted = false;
          delete v.dataset.autoMutedFallback;
          v.play().catch(function(){ v.muted = true; });
        }
      });
    });

    var activeStageMediaKey = "";
    var lastVideoSyncKey = "";
    var lastVideoControlKey = "";
    var videoSyncSeq = 0;
    var pendingVideoSync = null;

    function obterVideoAtivoParaSync() {
      var stage = document.getElementById('telaoMediaStage');
      var sVid = document.getElementById('telaoStageVideo');
      if (stage && stage.style.display !== 'none' && sVid && sVid.style.display !== 'none' && activeStageMediaKey) {
        return { el: sVid, key: activeStageMediaKey };
      }
      var bgVid = document.querySelector('.slide-background.present video');
      if (bgVid) {
        var idx = (typeof Reveal.getIndices === 'function') ? (Reveal.getIndices().h || 0) : 0;
        return { el: bgVid, key: 'BG_VIDEO_' + idx };
      }
      return null;
    }

    function coletarEstadoVideoAtivo() {
      var ativo = obterVideoAtivoParaSync();
      if (!ativo || !ativo.el) return null;
      var slideIdx = (typeof Reveal.getIndices === 'function') ? (Reveal.getIndices().h || 0) : 0;
      var curSlide = (typeof Reveal.getCurrentSlide === 'function') ? Reveal.getCurrentSlide() : null;
      var mid = ativo.el.getAttribute('data-media-id') || (curSlide ? (curSlide.getAttribute('data-media-id') || '') : '');
      return {
        syncId: ++videoSyncSeq,
        mediaKey: ativo.key,
        mediaId: mid,
        slideIndex: slideIdx,
        currentTime: Number(ativo.el.currentTime) || 0,
        duration: (ativo.el.duration && isFinite(ativo.el.duration)) ? Number(ativo.el.duration) : 0,
        paused: !!ativo.el.paused,
        playbackRate: Number(ativo.el.playbackRate) || 1,
        sentAt: Date.now()
      };
    }

    function emitirSyncVideoTelao() {
      if (!isExternalTelao) return;
      var st = coletarEstadoVideoAtivo();
      if (!st) return;
      enviarMensagemParaPainel({ action: 'VIDEO_SYNC', payload: st });
    }

    function emitirEstadoPreviewParaPainel() {
      if (isExternalTelao) return;
      var st = coletarEstadoVideoAtivo();
      if (!st) return;
      enviarMensagemParaPainel({ action: 'PREVIEW_VIDEO_STATE', payload: st });
    }

    function executarControleVideo(payload) {
      if (!payload) return;
      if (isExternalTelao && isTelaoFrozen) return;
      var cmd = payload.command;
      var ativo = obterVideoAtivoParaSync();
      if (!ativo || !ativo.el) return;
      var vid = ativo.el;
      var dur = (vid.duration && isFinite(vid.duration)) ? vid.duration : Infinity;

      if (cmd === 'toggle') {
        if (vid.paused) {
          delete vid.dataset.userPaused;
          reproduzirVideoComFallback(vid, true);
        } else {
          vid.dataset.userPaused = 'true';
          vid.removeAttribute('autoplay');
          vid.autoplay = false;
          try { vid.pause(); } catch(e) {}
        }
      } else if (cmd === 'play') {
        delete vid.dataset.userPaused;
        reproduzirVideoComFallback(vid, true);
      } else if (cmd === 'pause') {
        vid.dataset.userPaused = 'true';
        vid.removeAttribute('autoplay');
        vid.autoplay = false;
        try { vid.pause(); } catch(e) {}
      } else if (cmd === 'restart') {
        delete vid.dataset.userPaused;
        try { vid.currentTime = 0; } catch(e) {}
        reproduzirVideoComFallback(vid, true);
      } else if (cmd === 'seekBy') {
        var delta = Number(payload.value) || 0;
        var target = Math.max(0, Math.min(dur, (vid.currentTime || 0) + delta));
        try { vid.currentTime = target; } catch(e) {}
      } else if (cmd === 'seek') {
        var absPos = Math.max(0, Math.min(dur, Number(payload.value) || 0));
        try { vid.currentTime = absPos; } catch(e) {}
      }

      if (isExternalTelao) {
        emitirSyncVideoTelao();
      } else {
        emitirEstadoPreviewParaPainel();
      }
    }

    function aplicarSyncVideoPreview(payload) {
      if (isExternalTelao || !payload) return;
      var ativo = obterVideoAtivoParaSync();
      if (!ativo || !ativo.el || (payload.mediaKey && payload.mediaKey !== ativo.key)) {
        pendingVideoSync = payload;
        return;
      }
      var vid = ativo.el;
      vid.muted = true;
      vid.defaultMuted = true;
      try { vid.volume = 0; } catch(e) {}

      if (vid.readyState < 1) {
        pendingVideoSync = payload;
        return;
      }
      pendingVideoSync = null;

      var rate = (payload.playbackRate && isFinite(payload.playbackRate) && payload.playbackRate > 0) ? payload.playbackRate : 1;
      var elapsedSec = (!payload.paused && payload.sentAt)
        ? Math.min(1.5, Math.max(0, (Date.now() - payload.sentAt) / 1000))
        : 0;
      var expectedTime = (Number(payload.currentTime) || 0) + (elapsedSec * rate);
      var dur = vid.duration;
      if (dur && isFinite(dur) && dur > 0) {
        expectedTime = expectedTime % dur;
      }

      if (vid.playbackRate !== rate) {
        try { vid.playbackRate = rate; } catch(e) {}
      }

      if (payload.paused) {
        if (!vid.paused) {
          try { vid.pause(); } catch(e) {}
        }
        if (Math.abs((vid.currentTime || 0) - expectedTime) > 0.15) {
          try { vid.currentTime = expectedTime; } catch(e) {}
        }
      } else {
        if (!isPreviewFrozen && vid.paused) {
          reproduzirVideoComFallback(vid);
        }
        var curTime = vid.currentTime || 0;
        var diff = Math.abs(curTime - expectedTime);
        if (dur && isFinite(dur) && dur > 1) {
          diff = Math.min(diff, Math.abs(dur - diff));
        }
        if (diff > 0.22) {
          try { vid.currentTime = expectedTime; } catch(e) {}
        }
      }
    }

    function silenciarBackgroundVideosPreview() {
      if (isExternalTelao) return;
      document.querySelectorAll('.slide-background video').forEach(function(v) {
        v.muted = true;
        v.defaultMuted = true;
        try { v.volume = 0; } catch(e) {}
      });
    }

    function configurarSincronizacaoVideo() {
      var sVid = document.getElementById('telaoStageVideo');
      if (!sVid) return;

      // Intercepta globalmente qualquer <video> (palco ou fundo Reveal) impedindo auto-play/desmute ao pausar, congelar ou restaurar
      ['play', 'playing'].forEach(function(evtName) {
        document.addEventListener(evtName, function(e) {
          var v = e && e.target;
          if (!v || v.tagName !== 'VIDEO') return;
          if (estaCongeladoAgora() || v.dataset.userPaused === 'true') {
            try { v.pause(); } catch(err) {}
            if (isExternalTelao && isTelaoFrozen) {
              v.muted = true;
              try { v.volume = 0; } catch(err) {}
            }
          }
        }, true);
      });

      document.addEventListener('volumechange', function(e) {
        var v = e && e.target;
        if (!v || v.tagName !== 'VIDEO') return;
        if (!isExternalTelao || (isExternalTelao && isTelaoFrozen)) {
          if (v.dataset.forcingMute === '1') return;
          if (!v.muted || v.volume > 0) {
            v.dataset.forcingMute = '1';
            try {
              if (!v.muted) v.muted = true;
              if (v.volume > 0) v.volume = 0;
            } catch(err) {}
            delete v.dataset.forcingMute;
          }
        }
      }, true);

      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          if (estaCongeladoAgora() || sVid.dataset.userPaused === 'true') {
            if (!sVid.paused) {
              try { sVid.pause(); } catch(e) {}
            }
          }
        }
      });

      if (isExternalTelao) {
        sVid.addEventListener('loadeddata', function() {
          if (isTelaoFrozen) capturarQuadroVideoParaCanvas(sVid);
        });
        ['loadedmetadata', 'play', 'playing', 'pause', 'seeked'].forEach(function(evt) {
          sVid.addEventListener(evt, emitirSyncVideoTelao);
        });
        setInterval(emitirSyncVideoTelao, 400);
      } else {
        // Garante silêncio permanente na pré-visualização para evitar duplicidade de áudio com o Telão
        sVid.muted = true;
        sVid.defaultMuted = true;
        try { sVid.volume = 0; } catch(e) {}
        ['loadedmetadata', 'canplay'].forEach(function(evt) {
          sVid.addEventListener(evt, function() {
            if (pendingVideoSync) aplicarSyncVideoPreview(pendingVideoSync);
            emitirEstadoPreviewParaPainel();
          });
        });
        ['play', 'playing', 'pause', 'seeked'].forEach(function(evt) {
          sVid.addEventListener(evt, emitirEstadoPreviewParaPainel);
        });
        setInterval(emitirEstadoPreviewParaPainel, 400);
      }
    }

    function aplicarBlobUrl(el, url, mediaId, fileName) {
      if (!el || !url) return;

      el.onerror = function() {
        var key = mediaId || fileName || el.src;
        if (!retriedWithBuffer[key] && (mediaId || fileName)) {
          retriedWithBuffer[key] = true;
          el.dataset.resolvedLocally = "false";
          solicitarMidiaAoPainel(mediaId, fileName, true);
        } else if (fileName && !el.dataset.fallbackRelApplied) {
          el.dataset.fallbackRelApplied = "true";
          var isVid = (el.tagName === 'VIDEO');
          el.src = (isVid ? 'videos/' : 'imagens/') + encodeURIComponent(fileName);
        }
      };

      if (el.tagName === 'VIDEO') {
        el.querySelectorAll('source').forEach(function(s) { s.remove(); });
        if (el.src !== url) {
          el.src = url;
          el.load();
        }
        el.dataset.resolvedLocally = "true";
        if (!isExternalTelao) {
          el.muted = true;
          el.defaultMuted = true;
          try { el.volume = 0; } catch(e) {}
        }
        reproduzirVideoComFallback(el);
      } else {
        if (el.src !== url) {
          el.src = url;
        }
        el.dataset.resolvedLocally = "true";
      }
    }

    function solicitarMidiaAoPainel(mediaId, fileName, forceBuffer) {
      var reqMsg = {
        action: 'REQUEST_MEDIA_BLOB',
        mediaId: mediaId || "",
        fileName: fileName || "",
        forceBuffer: !!forceBuffer || (window.location && window.location.protocol === 'file:'),
        timestamp: Date.now()
      };
      if (projectionChannel) {
        try { projectionChannel.postMessage(reqMsg); } catch(e) {}
      }
      var target = (window.opener && !window.opener.closed) ? window.opener : (window.parent && window.parent !== window ? window.parent : null);
      if (target) {
        try { target.postMessage(reqMsg, "*"); } catch(e) {}
      }
    }

    async function resolverFonteMidia(mediaId, fileName, fallbackSrc) {
      if (mediaId && telaoLocalBlobUrls[mediaId]) return telaoLocalBlobUrls[mediaId];
      if (fileName && telaoLocalBlobUrls['file:' + fileName]) return telaoLocalBlobUrls['file:' + fileName];

      var blobOrUrl = null;
      var hostWin = (window.opener && !window.opener.closed) ? window.opener : (window.parent && window.parent !== window ? window.parent : null);
      if (hostWin) {
        try {
          if (typeof hostWin.obterBlobParaTelao === 'function') {
            blobOrUrl = hostWin.obterBlobParaTelao(mediaId, fileName);
          }
        } catch(e) {}
      }

      if (!blobOrUrl && mediaId) {
        blobOrUrl = await obterBlobDoIndexedDB(mediaId);
      }

      if (blobOrUrl) {
        var resolvedUrl = (typeof blobOrUrl === 'string') ? blobOrUrl : window.URL.createObjectURL(blobOrUrl);
        if (mediaId) telaoLocalBlobUrls[mediaId] = resolvedUrl;
        if (fileName) telaoLocalBlobUrls['file:' + fileName] = resolvedUrl;
        return resolvedUrl;
      }

      var isFileProto = (window.location && window.location.protocol === 'file:');
      if (fallbackSrc && !fallbackSrc.startsWith('blob:null') && (!isFileProto || !fallbackSrc.startsWith('blob:'))) {
        return fallbackSrc;
      }

      return null;
    }

    function esconderStageMidia() {
      activeStageMediaKey = "";
      pendingVideoSync = null;
      var stage = document.getElementById('telaoMediaStage');
      var sImg = document.getElementById('telaoStageImg');
      var sVid = document.getElementById('telaoStageVideo');
      if (sVid) {
        sVid.onerror = null;
        try { sVid.pause(); } catch(e) {}
        if (sVid.hasAttribute('src')) {
          sVid.removeAttribute('src');
          try { sVid.load(); } catch(e) {}
        }
        sVid.removeAttribute('data-media-id');
        sVid.removeAttribute('data-file-name');
        sVid.style.display = 'none';
      }
      if (sImg) {
        sImg.onerror = null;
        sImg.removeAttribute('src');
        sImg.removeAttribute('data-media-id');
        sImg.removeAttribute('data-file-name');
        sImg.style.display = 'none';
      }
      if (stage) stage.style.display = 'none';
    }

    async function atualizarStageMidia() {
      var currentSlide = (typeof Reveal.getCurrentSlide === 'function') ? Reveal.getCurrentSlide() : null;
      if (!currentSlide || currentSlide.getAttribute('data-media-slide') !== 'true') {
        esconderStageMidia();
        return;
      }

      var mediaType = currentSlide.getAttribute('data-media-type') || 'image';
      var mediaId = currentSlide.getAttribute('data-media-id') || '';
      var fileName = currentSlide.getAttribute('data-file-name') || '';
      var fallbackSrc = currentSlide.getAttribute('data-media-src') || '';
      var stageKey = mediaType + '|' + mediaId + '|' + fileName + '|' + fallbackSrc;

      var stage = document.getElementById('telaoMediaStage');
      var sImg = document.getElementById('telaoStageImg');
      var sVid = document.getElementById('telaoStageVideo');
      if (!stage || !sImg || !sVid) return;

      stage.style.display = 'flex';
      var targetEl = (mediaType === 'video') ? sVid : sImg;

      // Mantém reprodução contínua sem recarregar nem piscar se o mesmo slide já está ativo ou em resolução
      if (stageKey === activeStageMediaKey && ((targetEl.dataset.resolvedLocally === 'true' && targetEl.src) || targetEl.dataset.resolvingStageKey === stageKey)) {
        if (mediaType === 'video' && targetEl.dataset.resolvedLocally === 'true' && targetEl.dataset.userPaused !== 'true' && !estaCongeladoAgora()) {
          reproduzirVideoComFallback(sVid);
        }
        return;
      }

      activeStageMediaKey = stageKey;
      targetEl.dataset.resolvingStageKey = stageKey;
      delete targetEl.dataset.fallbackRelApplied;
      delete targetEl.dataset.resolvedLocally;
      delete targetEl.dataset.userPaused;

      if (mediaType === 'video') {
        sImg.style.display = 'none';
        sImg.removeAttribute('data-media-id');
        sImg.removeAttribute('data-file-name');
        sVid.style.display = 'block';
        if (mediaId) sVid.setAttribute('data-media-id', mediaId);
        if (fileName) sVid.setAttribute('data-file-name', fileName);
        if (!isExternalTelao || isTelaoFrozen) {
          sVid.muted = true;
          try { sVid.volume = 0; } catch(e) {}
        } else {
          sVid.muted = false;
          try { sVid.volume = 1; } catch(e) {}
          delete sVid.dataset.autoMutedFallback;
        }
      } else {
        try { sVid.pause(); } catch(e) {}
        sVid.style.display = 'none';
        sVid.removeAttribute('data-media-id');
        sVid.removeAttribute('data-file-name');
        sImg.style.display = 'block';
        if (mediaId) sImg.setAttribute('data-media-id', mediaId);
        if (fileName) sImg.setAttribute('data-file-name', fileName);
      }

      var resolvedUrl = await resolverFonteMidia(mediaId, fileName, fallbackSrc);
      if (targetEl.dataset.resolvingStageKey === stageKey) {
        delete targetEl.dataset.resolvingStageKey;
      }
      if (activeStageMediaKey !== stageKey) return;

      if (resolvedUrl) {
        aplicarBlobUrl(targetEl, resolvedUrl, mediaId, fileName);
        if (isExternalTelao && mediaType === 'video') {
          setTimeout(emitirSyncVideoTelao, 80);
        } else if (!isExternalTelao && mediaType === 'video' && pendingVideoSync) {
          aplicarSyncVideoPreview(pendingVideoSync);
        }
      } else if (mediaId || fileName) {
        solicitarMidiaAoPainel(mediaId, fileName, window.location && window.location.protocol === 'file:');
      }
    }

    async function resolverElementoMidia(el) {
      var mediaId = el.getAttribute('data-media-id');
      var fileName = el.getAttribute('data-file-name');
      if (!mediaId && !fileName) return;

      var estaCarregada = false;
      if (el.dataset.resolvedLocally === "true" && el.src && !el.src.startsWith('blob:null')) {
        if (el.tagName === 'IMG') {
          estaCarregada = el.complete && el.naturalWidth > 0;
        } else if (el.tagName === 'VIDEO') {
          estaCarregada = el.readyState > 0 || !el.error;
        }
      }

      if (estaCarregada) {
        if (el.tagName === 'VIDEO') reproduzirVideoComFallback(el);
        return;
      }

      var resolvedUrl = await resolverFonteMidia(mediaId, fileName, el.getAttribute('src') || '');
      if (resolvedUrl) {
        aplicarBlobUrl(el, resolvedUrl, mediaId, fileName);
      } else {
        solicitarMidiaAoPainel(mediaId, fileName, window.location && window.location.protocol === 'file:');
      }
    }

    async function verificarEResolverMidias() {
      await atualizarStageMidia();
      // Pré-aquece mídias dos demais slides no cache local sem bloquear o slide atual
      document.querySelectorAll('.slides section[data-media-slide="true"]').forEach(function(sec) {
        var mid = sec.getAttribute('data-media-id');
        var fname = sec.getAttribute('data-file-name');
        if (mid && !telaoLocalBlobUrls[mid]) {
          resolverFonteMidia(mid, fname, sec.getAttribute('data-media-src') || '');
        }
      });
    }

    Reveal.addEventListener('slidechanged', function() {
      fitTextToSlide();
      silenciarBackgroundVideosPreview();
      atualizarStageMidia();
    });

    Reveal.addEventListener('ready', function() {
      fitTextToSlide();
      silenciarBackgroundVideosPreview();
      verificarEResolverMidias();
    });

    window.addEventListener('resize', function() {
      fitTextToSlide();
    });

    // Notifica o painel que o Telão externo está pronto
    function notifyPainelReady() {
      if (isExternalTelao) {
        enviarMensagemParaPainel({ action: 'TELAO_READY', isExternal: true, timestamp: Date.now() });
        if (window.opener && typeof window.opener.postMessage === 'function') {
          try {
            window.opener.postMessage(JSON.stringify({
              host: 'projection-html5-painel',
              function: 'opened',
              isExternal: true,
              url: window.location.href,
              data: { data: "ok" }
            }), "*");
          } catch (e) {}
        }
      }
    }

    // Ao fechar ou recarregar a janela externa, avisa imediatamente o painel
    window.addEventListener('beforeunload', function() {
      if (isExternalTelao) {
        enviarMensagemParaPainel({ action: 'TELAO_CLOSED', timestamp: Date.now() });
      }
    });

    $(document).ready(function() {
      configurarSincronizacaoVideo();
      notifyPainelReady();
      setTimeout(fitTextToSlide, 100);
    });
    })()
  </script>
</body>
