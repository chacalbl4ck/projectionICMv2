<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>View - Projection HTML5</title>
  <link rel="stylesheet" href="css/reveal.css">
  <link rel="stylesheet" href="css/theme/icm.css" id="theme"> 
  <link rel="stylesheet" href="css/view.css"> 
</head>
<body>
  <!-- Camada de Blackout Instantâneo -->
  <div id="blackoutOverlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000000; z-index: 999999; opacity: 0; pointer-events: none; transition: opacity 0.25s ease-in-out;"></div>

  <!-- Container de Vídeo do YouTube em Tela Cheia -->
  <div id="ytPlayerWrapper" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000000; z-index: 50; display: none; align-items: center; justify-content: center; overflow: hidden;">
    <iframe id="ytPlayerFrame" 
            style="width: 100vw; height: 100vh; border: 0;" 
            src="" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            referrerpolicy="strict-origin-when-cross-origin" 
            allowfullscreen>
    </iframe>
    <!-- Alerta visual caso o vídeo possua restrições do YouTube -->
    <div id="ytErrorNotice" style="display: none; position: absolute; background: rgba(18, 18, 18, 0.95); border: 2px solid #dc3545; border-radius: 12px; padding: 24px 32px; color: #fff; max-width: 620px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.85); z-index: 60;">
      <div style="font-size: 38px; color: #dc3545; margin-bottom: 8px;">⚠️</div>
      <h4 style="margin: 0 0 10px; font-weight: bold; color: #fff;">Reprodução Restrita no YouTube</h4>
      <p style="font-size: 14px; color: #ccc; margin-bottom: 18px;" id="ytErrorText">O autor deste vídeo desativou a incorporação externa ou o YouTube exige acesso direto.</p>
      <a id="ytDirectLinkBtn" href="#" target="_blank" style="background: #dc3545; color: white; padding: 10px 22px; border-radius: 6px; text-decoration: none; font-weight: bold; display: inline-block;">
        Abrir Diretamente no YouTube
      </a>
    </div>
  </div>

  <!-- 2. Create hidden header/footer <div> -->
  <div class="reveal">
    <!-- Headers Padrão ICM -->
    <header class="winetitle"><div id="titulo"></div><div id="logo" style="background-color:white"><i class="icon-logo_bold"></i></div></header>
    <header class="winetitle2"><div id="titulo"><br></div><div id="logo" style="background-color:white"><i class="icon-logo_bold"></i></div></header>    
    <header class="whitelogo"><div id="logo" style="float:right"><i class="icon-logo_bold_white"></i></div></header>
    <header class="backlay1-pt-br"><div class="backlay_1-pt-br"><i class="logo_tela_padrao icon-logo_bold_white"></i></div></header>
    

    <footer class="fim">FIM</footer>
    <footer class="scripturetitle"><small></small></footer>      

    <div class="slides">
    
    </div>    

  </div>

  <!-- Scripts -->
  <script src="js/jquery-3.3.1.min.js"></script>
  <script src="js/reveal.js"></script>
  <script>
    Reveal.initialize({
      controls: false,
      progress: false,
      history: false,
      keyboard: true,
      center: true,
      theme: Reveal.getQueryHash().theme, // available themes are in /css/theme
      transition: 'fade', // default/cube/page/concave/zoom/linear/fade/none
    });  
    (function(){
    // ==========================================
    // CANAL DE COMUNICAÇÃO NATIVO BROADCASTCHANNEL
    // ==========================================
    const projectionChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('projecao_icm_channel') : null;

    // Distingue se esta janela é o TELÃO EXTERNO real (janela separada) ou apenas o IFRAME de miniatura no painel
    const isExternalTelao = (window.self === window.top);

    // ==========================================
    // REPRODUÇÃO E CONTROLE DE VÍDEOS DO YOUTUBE
    // ==========================================
    var ytPlayer = null;
    var isYtApiReady = false;
    var currentLoadedYtId = null;
    var currentYtTime = 0;
    var currentYtDuration = 0;
    var currentYtState = -1;
    var isYtMuted = false;
    var currentVolume = 100;
    var ytProgressInterval = null;

    // Dispara comandos nativos para o iframe do YouTube via postMessage
    function postYtCommand(func, args) {
      var frame = document.getElementById('ytPlayerFrame');
      if (frame && frame.contentWindow) {
        try {
          frame.contentWindow.postMessage(JSON.stringify({
            event: 'command',
            func: func,
            args: args || []
          }), '*');
        } catch(e) {}
      }
    }

    // Receptor das mensagens de status nativas do iframe do YouTube (infoDelivery)
    window.addEventListener('message', function(event) {
      try {
        var data = (typeof event.data === 'string') ? JSON.parse(event.data) : event.data;
        if (data && data.event === 'infoDelivery' && data.info) {
          if (data.info.currentTime !== undefined) currentYtTime = data.info.currentTime;
          if (data.info.duration !== undefined) currentYtDuration = data.info.duration;
          if (data.info.playerState !== undefined) currentYtState = data.info.playerState;
          if (data.info.muted !== undefined) isYtMuted = data.info.muted;
          if (data.info.volume !== undefined) currentVolume = data.info.volume;
          emitYtStatus();
        }
      } catch (e) {}
    });

    window.onYouTubeIframeAPIReady = function() {
      isYtApiReady = true;
    };

    function startYtProgressLoop() {
      if (ytProgressInterval) clearInterval(ytProgressInterval);
      ytProgressInterval = setInterval(function() {
        if (ytPlayer && typeof ytPlayer.getCurrentTime === 'function') {
          try {
            currentYtTime = ytPlayer.getCurrentTime() || currentYtTime;
            currentYtDuration = ytPlayer.getDuration() || currentYtDuration;
            currentYtState = (typeof ytPlayer.getPlayerState === 'function') ? ytPlayer.getPlayerState() : currentYtState;
          } catch(e) {}
        }
        emitYtStatus();
      }, 350);
    }

    function stopYtProgressLoop() {
      if (ytProgressInterval) {
        clearInterval(ytProgressInterval);
        ytProgressInterval = null;
      }
    }

    function emitYtStatus() {
      try {
        var statusPayload = {
          currentTime: currentYtTime || 0,
          duration: currentYtDuration || 0,
          playerState: currentYtState,
          isMuted: isYtMuted,
          volume: currentVolume,
          ytId: currentLoadedYtId,
          isExternal: isExternalTelao
        };

        if (isExternalTelao && projectionChannel) {
          projectionChannel.postMessage({ action: 'YOUTUBE_STATUS', payload: statusPayload });
        } else if (!isExternalTelao && window.parent && window.parent !== window) {
          window.parent.postMessage(JSON.stringify({
            host: 'projection-html5-painel',
            function: 'YOUTUBE_STATUS',
            data: statusPayload
          }), "*");
        }
      } catch (e) {}
    }

    function showYtErrorNotice(ytId) {
      var notice = document.getElementById('ytErrorNotice');
      var linkBtn = document.getElementById('ytDirectLinkBtn');
      if (notice) {
        if (linkBtn) linkBtn.href = 'https://www.youtube.com/watch?v=' + ytId;
        notice.style.display = 'block';
      }
    }

    function hideYtErrorNotice() {
      var notice = document.getElementById('ytErrorNotice');
      if (notice) notice.style.display = 'none';
    }

    function initOrLoadYtVideo(ytId) {
      var wrapper = document.getElementById('ytPlayerWrapper');
      var frame = document.getElementById('ytPlayerFrame');
      if (wrapper) wrapper.style.display = 'flex';
      hideYtErrorNotice();

      if (currentLoadedYtId === ytId && frame && frame.src) {
        postYtCommand('playVideo');
        if (ytPlayer && typeof ytPlayer.playVideo === 'function') ytPlayer.playVideo();
        startYtProgressLoop();
        return;
      }

      currentLoadedYtId = ytId;
      currentYtTime = 0;
      currentYtDuration = 0;
      currentYtState = -1;

      // URL no domínio youtube-nocookie com privacidade e sem bloqueios de referrer
      var muteParam = (!isExternalTelao) ? "&mute=1" : "";
      var embedUrl = "https://www.youtube-nocookie.com/embed/" + ytId + "?enablejsapi=1&autoplay=1&rel=0&playsinline=1" + muteParam;

      if (frame) {
        frame.src = embedUrl;
        frame.onload = function() {
          try {
            // Handshake inicial de escuta via postMessage
            frame.contentWindow.postMessage(JSON.stringify({
              event: 'listening',
              id: 1,
              channel: 'widget'
            }), '*');

            if (!isExternalTelao) {
              postYtCommand('mute');
            } else {
              postYtCommand('unMute');
              postYtCommand('setVolume', [currentVolume]);
            }
            postYtCommand('playVideo');
          } catch(e) {}
        };
      }

      // Se a API YT estiver carregada, vincula ao iframe existente sem recriar
      if (isYtApiReady && window.YT && window.YT.Player && frame) {
        try {
          if (ytPlayer && typeof ytPlayer.destroy === 'function') {
            try { ytPlayer.destroy(); } catch(e){}
          }
          ytPlayer = new YT.Player('ytPlayerFrame', {
            host: 'https://www.youtube-nocookie.com',
            events: {
              onReady: function(event) {
                if (!isExternalTelao) {
                  event.target.mute();
                } else {
                  event.target.unMute();
                  event.target.setVolume(currentVolume);
                }
                event.target.playVideo();
                startYtProgressLoop();
                emitYtStatus();
              },
              onStateChange: function(event) {
                if (event && event.data !== undefined) currentYtState = event.data;
                emitYtStatus();
              },
              onError: function(event) {
                console.warn("YouTube Embed Error:", event.data);
                showYtErrorNotice(ytId);
              }
            }
          });
        } catch(e) {
          console.warn("Erro ao vincular YT.Player", e);
        }
      }

      startYtProgressLoop();
      emitYtStatus();
    }

    function checkYouTubeSlide() {
      var currentSlide = Reveal.getCurrentSlide();
      if (!currentSlide) {
        var indices = (typeof Reveal.getIndices === 'function') ? Reveal.getIndices() : { h: 0 };
        var allSlides = document.querySelectorAll('.reveal .slides section');
        if (allSlides && allSlides[indices.h]) {
          currentSlide = allSlides[indices.h];
        }
      }

      var ytId = currentSlide ? currentSlide.getAttribute('data-youtube-id') : null;
      var wrapper = document.getElementById('ytPlayerWrapper');
      var frame = document.getElementById('ytPlayerFrame');

      if (ytId) {
        initOrLoadYtVideo(ytId);
      } else {
        if (wrapper) wrapper.style.display = 'none';
        hideYtErrorNotice();
        postYtCommand('pauseVideo');
        if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
          try { ytPlayer.pauseVideo(); } catch(e) {}
        }
        stopYtProgressLoop();
      }
    }

    function handleYoutubeCommand(payload) {
      if (!payload) return;
      var cmd = payload.cmd;
      try {
        if (cmd === 'play') {
          currentYtState = 1;
          postYtCommand('playVideo');
          if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
            try { ytPlayer.playVideo(); } catch(e) {}
          }
        } else if (cmd === 'pause') {
          currentYtState = 2;
          postYtCommand('pauseVideo');
          if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
            try { ytPlayer.pauseVideo(); } catch(e) {}
          }
        } else if (cmd === 'togglePlay') {
          if (currentYtState === 1) {
            currentYtState = 2;
            postYtCommand('pauseVideo');
            if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
              try { ytPlayer.pauseVideo(); } catch(e) {}
            }
          } else {
            currentYtState = 1;
            postYtCommand('playVideo');
            if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
              try { ytPlayer.playVideo(); } catch(e) {}
            }
          }
        } else if (cmd === 'stop') {
          currentYtState = 2;
          currentYtTime = 0;
          postYtCommand('seekTo', [0, true]);
          postYtCommand('pauseVideo');
          if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
            try {
              ytPlayer.pauseVideo();
              if (typeof ytPlayer.seekTo === 'function') ytPlayer.seekTo(0, true);
            } catch(e) {}
          }
        } else if (cmd === 'seek') {
          if (payload.seconds !== undefined) {
            currentYtTime = payload.seconds;
            postYtCommand('seekTo', [payload.seconds, true]);
            if (ytPlayer && typeof ytPlayer.seekTo === 'function') {
              try { ytPlayer.seekTo(payload.seconds, true); } catch(e) {}
            }
          }
        } else if (cmd === 'rewind') {
          var cur = currentYtTime || 0;
          var target = Math.max(0, cur - (payload.seconds || 10));
          currentYtTime = target;
          postYtCommand('seekTo', [target, true]);
          if (ytPlayer && typeof ytPlayer.seekTo === 'function') {
            try { ytPlayer.seekTo(target, true); } catch(e) {}
          }
        } else if (cmd === 'forward') {
          var cur = currentYtTime || 0;
          var dur = currentYtDuration || cur + 30;
          var target = Math.min(dur, cur + (payload.seconds || 10));
          currentYtTime = target;
          postYtCommand('seekTo', [target, true]);
          if (ytPlayer && typeof ytPlayer.seekTo === 'function') {
            try { ytPlayer.seekTo(target, true); } catch(e) {}
          }
        } else if (cmd === 'setVolume') {
          if (payload.volume !== undefined) {
            currentVolume = parseInt(payload.volume, 10);
            if (isNaN(currentVolume)) currentVolume = 100;
            postYtCommand('setVolume', [currentVolume]);
            if (ytPlayer && typeof ytPlayer.setVolume === 'function') {
              try { ytPlayer.setVolume(currentVolume); } catch(e) {}
            }
            if (currentVolume > 0 && isYtMuted) {
              isYtMuted = false;
              postYtCommand('unMute');
              if (ytPlayer && typeof ytPlayer.unMute === 'function') {
                try { ytPlayer.unMute(); } catch(e) {}
              }
            }
          }
        } else if (cmd === 'setMute' || cmd === 'toggleMute') {
          if (payload.mute !== undefined) {
            isYtMuted = !!payload.mute;
          } else {
            isYtMuted = !isYtMuted;
          }
          if (isYtMuted) {
            postYtCommand('mute');
            if (ytPlayer && typeof ytPlayer.mute === 'function') {
              try { ytPlayer.mute(); } catch(e) {}
            }
          } else {
            postYtCommand('unMute');
            if (ytPlayer && typeof ytPlayer.unMute === 'function') {
              try { ytPlayer.unMute(); } catch(e) {}
            }
            if (currentVolume <= 0) currentVolume = 100;
            postYtCommand('setVolume', [currentVolume]);
            if (ytPlayer && typeof ytPlayer.setVolume === 'function') {
              try { ytPlayer.setVolume(currentVolume); } catch(e) {}
            }
          }
        }
      } catch (e) {
        console.warn("Erro ao executar comando do YouTube no telão", e);
      }
      emitYtStatus();
    }

    var lastProcessedSig = '';
    var lastProcessedTime = 0;

    function processCommand(funcName, payload) {
      var sig = funcName + '_' + (typeof payload === 'object' ? JSON.stringify(payload) : String(payload));
      var now = Date.now();
      if (sig === lastProcessedSig && (now - lastProcessedTime) < 150) {
        return; // Ignora duplicatas simultâneas de BroadcastChannel + postMessage
      }
      lastProcessedSig = sig;
      lastProcessedTime = now;

      if (funcName === 'reloadReveal' || funcName === 'RELOAD_SLIDES') {
        reloadReveal(payload);
      } else if (funcName === 'changeSlide' || funcName === 'CHANGE_SLIDE') {
        changeSlide(payload);
      } else if (funcName === 'changeBg' || funcName === 'CHANGE_BG') {
        changeBg(payload);
      } else if (funcName === 'changeTheme' || funcName === 'CHANGE_THEME') {
        changeTheme(payload);
      } else if (funcName === 'changeFontSize' || funcName === 'CHANGE_FONT_SIZE') {
        changeFontSize(payload);
      } else if (funcName === 'blackout' || funcName === 'BLACKOUT') {
        toggleBlackout(payload);
      } else if (funcName === 'YOUTUBE_CMD') {
        handleYoutubeCommand(payload);
      } else if (funcName === 'REQUEST_STATUS' || funcName === 'PING') {
        // Apenas a janela externa real confirma status de telão ativo
        if (isExternalTelao && projectionChannel) {
          projectionChannel.postMessage({ action: 'TELAO_READY', isExternal: true, timestamp: Date.now() });
        }
      }
    }

    if (projectionChannel) {
      projectionChannel.onmessage = function(event) {
        if (!event.data) return;
        processCommand(event.data.action, event.data.payload);
      };
    }

    // Compatibilidade via postMessage (para iframe de miniatura ou navegadores legados)
    window.addEventListener('message', function(event) {
      try {
        var data = JSON.parse(event.data);
        if (data.host === 'projection-html5') {
          processCommand(data.function, data.data);
        }
      } catch (e) {
        // Ignora mensagens de outras extensões/fontes
      }
    });

    function toggleBlackout(status) {
      var overlay = document.getElementById('blackoutOverlay');
      if (overlay) {
        overlay.style.opacity = status ? "1" : "0";
      }
    }

    function changeSlide(number) {
      Reveal.slide(number, number, number);
      checkYouTubeSlide();
    }

    function clearSlide(status) {
      if (status)
        $('.slides').fadeOut('slow');
      else
        $('.slides').fadeIn('slow');
    }       

    function changeBg(fileURL) {
      document.body.style.backgroundImage = "url(" + fileURL + ")";
    }

    function changeTheme(name){
      document.getElementById('theme').setAttribute('href', 'css/theme/'+name+'.css');
    }

    function changeFontSize(size){
      size+=2;
      $('.reveal').css("font-size", size + "vw");
    }

    function reloadReveal(htmlslides){
      $('.slides').html(htmlslides);
      Reveal.initialize({
        controls: false,
        progress: false,
        history: false,
        keyboard: true,
        // center: true,
        theme: Reveal.getQueryHash().theme, // available themes are in /css/theme
        transition: 'fade', // default/cube/page/concave/zoom/linear/fade/none
      });  
      Reveal.sync();      
      changeSlide(0);
      checkYouTubeSlide();
    }

    Reveal.addEventListener('slidechanged', function() {
      checkYouTubeSlide();
    });

    // Notifica o painel que o Telão externo está pronto
    function notifyPainelReady() {
      if (isExternalTelao) {
        if (projectionChannel) {
          projectionChannel.postMessage({ action: 'TELAO_READY', isExternal: true, timestamp: Date.now() });
        }
        if (window.opener && typeof window.opener.postMessage === 'function') {
          try {
            window.opener.postMessage(JSON.stringify({
              host: 'projection-html5-painel',
              function: 'opened',
              isExternal: true,
              url: window.location.href,
              data: { data: "ok" }
            }), "*");
          } catch (e) {}
        }
      }
    }

    // Ao fechar ou recarregar a janela externa, avisa imediatamente o painel
    window.addEventListener('beforeunload', function() {
      if (isExternalTelao && projectionChannel) {
        projectionChannel.postMessage({ action: 'TELAO_CLOSED', timestamp: Date.now() });
      }
    });

    $(document).ready(function() {
      notifyPainelReady();
    });
    })()
  </script>
  <!-- YouTube IFrame Player API -->
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
